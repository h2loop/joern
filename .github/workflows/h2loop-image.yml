name: h2loop hardened image

# Builds Joern from *this fork's source* (so build.sbt dependencyOverrides and the
# rebuilt goastgen actually land in the artifact), publishes it to
# ECR (hydron-platform/joern), and Trivy-scans the result.
#
# Upstream's containers.yml cannot do this: it installs the prebuilt joern-cli.zip
# from the latest joernio/joern release, which is unaffected by our fixes.
#
# Requires (same OIDC pattern as h2loop/hydron-cli):
#   secret AWS_ROLE_ARN  - role trusting repo:h2loop/joern:*, with ecr push rights
#   var    AWS_REGION    - us-east-1 (where hydron-platform/* lives)
# Without the secret the build and scan still run; the push is skipped loudly.

on:
  workflow_dispatch:
  push:
    branches:
      - security/bundled-dep-overrides
  schedule:
    - cron: "0 9 * * 1" # weekly, to pick up OS package patches

env:
  ECR_REPOSITORY: hydron-platform/joern
  LOCAL_TAG: joern-h2loop:ci

jobs:
  build-scan-push:
    if: github.repository_owner == 'h2loop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for aws-actions/configure-aws-credentials
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # sbt-dynver needs tags to compute the version

      # The sbt build plus image layers do not comfortably fit in the runner's
      # default free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image (load locally, do not push yet)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ci/Dockerfile.h2loop
          platforms: linux/amd64
          load: true
          tags: ${{ env.LOCAL_TAG }}
          cache-from: type=gha,scope=joern-h2loop
          cache-to: type=gha,mode=max,scope=joern-h2loop

      # Fail fast if the dependency overrides broke the distribution.
      - name: Smoke test the frontends code-ingestion uses
        run: |
          set -euo pipefail
          IMG=${{ env.LOCAL_TAG }}
          # Exactly the entrypoints app/joern_client.py resolves against
          # dirname(JOERN_CLI_PATH), i.e. /opt/joern/joern-cli/<tool>.
          docker run --rm --entrypoint sh "$IMG" -c '
            set -e
            cd /opt/joern/joern-cli
            for f in joern joern-parse c2cpg.sh javasrc2cpg pysrc2cpg jssrc2cpg.sh \
                     gosrc2cpg csharpsrc2cpg php2cpg rubysrc2cpg kotlin2cpg \
                     swiftsrc2cpg.sh; do
              test -x "./$f" || { echo "MISSING: $f"; exit 1; }
            done
            echo "all expected frontend entrypoints present"
          '
          # Actually parse something and confirm a CPG comes out. Language is
          # auto-detected, matching how code-ingestion drives c2cpg.sh.
          mkdir -p /tmp/smoke
          printf "int main(void){int x=1;return x;}\n" > /tmp/smoke/main.c
          docker run --rm -v /tmp/smoke:/work -w /work --entrypoint sh "$IMG" -c \
            '/opt/joern/joern-cli/c2cpg.sh /work --output /work/cpg.bin'
          test -s /tmp/smoke/cpg.bin
          echo "c2cpg produced a CPG"

      # Confirm the overrides are what actually got bundled, not just requested.
      # NB: the distribution has ~15 lib dirs, not one -- joern-cli/build.sbt maps
      # each frontend's staged output in under its own subdirectory -- so this must
      # search the whole tree. And it asserts the *absence of known-vulnerable
      # versions* rather than the presence of specific new ones: dependencyOverrides
      # only pins deps that are actually in the graph, so a dep that upstream no
      # longer pulls in legitimately yields no jar at all.
      - name: Verify no known-vulnerable jars survive anywhere in the image
        run: |
          set -uo pipefail
          docker run --rm --entrypoint sh ${{ env.LOCAL_TAG }} -c '
            find /opt/joern -name "*.jar" 2>/dev/null \
              | grep -iE "protobuf-java|undertow-core|bcprov|msgpack-core|okhttp|commons-io|plexus-utils" \
              | sed "s|.*/||" | sort -u
          ' > /tmp/bundled.txt || true
          echo "--- matching jars in the distribution ---"
          cat /tmp/bundled.txt
          {
            echo "### Bundled versions of the overridden dependencies"
            echo '```'
            cat /tmp/bundled.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

          fail=0
          # The versions the original Trivy scan flagged. Any of these still present
          # means an override did not take effect.
          for bad in \
            "protobuf-java-3.20.1" "protobuf-java-3.21.8" \
            "undertow-core-2.3.18" "undertow-core-2.3.19" "undertow-core-2.3.20" \
            "bcprov-jdk18on-1.78" "bcprov-jdk18on-1.79" "bcprov-jdk18on-1.80" \
            "msgpack-core-0.9.1.jar" "msgpack-core-0.9.2.jar" \
            "okhttp-4.7.2" "okhttp-4.8" "okhttp-4.9" "okhttp-4.10" "okhttp-4.11" \
            "commons-io-2.11.0" "commons-io-2.12" "commons-io-2.13" \
            "plexus-utils-3.2.1" "plexus-utils-3.3" "plexus-utils-3.4" "plexus-utils-3.5"; do
            if grep -q "$bad" /tmp/bundled.txt; then
              echo "STILL VULNERABLE: $bad is present"
              fail=1
            fi
          done
          if [ "$fail" = "0" ]; then
            echo "OK: none of the flagged vulnerable versions are present"
          fi
          exit $fail

      # go1.25.6 (v0.1.1-h2loop1) did NOT clear CVE-2025-68121 -- that needs 1.25.7+
      # -- so assert the toolchain rather than merely printing it.
      - name: Confirm goastgen is built with the expected Go toolchain
        run: |
          set -euo pipefail
          out=$(docker run --rm --entrypoint sh ${{ env.LOCAL_TAG }} -c '
            b=$(find /opt/joern -name "goastgen-linux" -type f | head -1)
            echo "binary: $b"
            strings "$b" 2>/dev/null | grep -oE "^go1\.[0-9]+(\.[0-9]+)?$" | sort -u
          ')
          echo "$out"
          echo "$out" | grep -q "go1.26.5" || {
            echo "goastgen was not built with go1.26.5 -- stdlib CVEs will persist"
            exit 1
          }

      # Run Trivy from its own image rather than via trivy-action: that action's
      # setup step installs the binary through the GitHub API and failed on run
      # 30581433009 ("installing Trivy binary" -> exit 1). Docker is already here.
      - name: Trivy scan
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache" \
            aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
                  --format table --timeout 20m \
                  --exit-code 0 \
                  ${{ env.LOCAL_TAG }} | tee trivy-report.txt

      - name: Trivy summary
        run: |
          {
            echo '## Trivy: HIGH/CRITICAL (fixable), `${{ env.ECR_REPOSITORY }}` candidate'
            echo '```'
            head -c 60000 trivy-report.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          echo "HIGH count:     $(grep -cE '\bHIGH\b' trivy-report.txt || true)"
          echo "CRITICAL count: $(grep -cE '\bCRITICAL\b' trivy-report.txt || true)"

      - name: Upload Trivy report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-report
          path: trivy-report.txt

      # --- publish to ECR (hydron-platform/joern, us-east-1) ---
      # Skipped, loudly, when the OIDC secret has not been configured yet.
      - name: Check for AWS credentials
        id: awscheck
        run: |
          if [ -n "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning title=ECR push skipped::secrets.AWS_ROLE_ARN is not set on this repo, so the image was built and scanned but NOT published. See SECURITY-FIXES.md."
            echo '> **Image NOT pushed** - `secrets.AWS_ROLE_ARN` is unset on h2loop/joern.' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.awscheck.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: steps.awscheck.outputs.configured == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@4625ce35226a7557230889aae2f52eb50ec3dcda # v2.0.1

      - name: Push to ECR (hardened + sha tags)
        if: steps.awscheck.outputs.configured == 'true'
        run: |
          set -euo pipefail
          REG=${{ steps.ecr.outputs.registry }}
          REPO="$REG/${{ env.ECR_REPOSITORY }}"
          SHORT=$(echo "${{ github.sha }}" | cut -c1-12)

          # Create the repository on first run rather than failing on push.
          aws ecr describe-repositories --repository-names "${{ env.ECR_REPOSITORY }}" >/dev/null 2>&1             || aws ecr create-repository                  --repository-name "${{ env.ECR_REPOSITORY }}"                  --image-scanning-configuration scanOnPush=true                  --image-tag-mutability MUTABLE

          for tag in hardened "sha-$SHORT"; do
            docker tag "${{ env.LOCAL_TAG }}" "$REPO:$tag"
            docker push "$REPO:$tag"
          done

          DIGEST=$(aws ecr describe-images \
                    --repository-name "${{ env.ECR_REPOSITORY }}" \
                    --image-ids imageTag=hardened \
                    --query 'imageDetails[0].imageDigest' --output text)
          {
            echo "### Published"
            echo ""
            echo "Pin this in \`code-ingestion-service/Dockerfile\`:"
            echo ""
            echo "    FROM $REPO@$DIGEST"
          } >> $GITHUB_STEP_SUMMARY
          echo "FROM $REPO@$DIGEST"

      # Bootstrap path: no GitHub OIDC role currently trusts repo:h2loop/joern:*
      # (the existing h2loop-github-deploy / h2loop-litellm-github-deploy roles are
      # scoped to h2loop/platform and litellm_gcp_cloud_run). Until that trust
      # policy is widened, hand the image off as a tarball so it can be loaded and
      # pushed to ECR with a developer's own credentials.
      - name: Export image tarball (only when the push was skipped)
        if: steps.awscheck.outputs.configured != 'true'
        run: |
          set -euo pipefail
          docker save ${{ env.LOCAL_TAG }} | gzip -1 > joern-hardened.tar.gz
          ls -lh joern-hardened.tar.gz
          {
            echo "### Image exported as an artifact"
            echo ""
            echo "Load and publish it with:"
            echo ""
            echo '    gh run download ${{ github.run_id }} -R h2loop/joern -n joern-image'
            echo '    gunzip -c joern-hardened.tar.gz | docker load'
            echo '    aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 501235162365.dkr.ecr.us-east-1.amazonaws.com'
            echo '    docker tag ${{ env.LOCAL_TAG }} 501235162365.dkr.ecr.us-east-1.amazonaws.com/${{ env.ECR_REPOSITORY }}:hardened'
            echo '    docker push 501235162365.dkr.ecr.us-east-1.amazonaws.com/${{ env.ECR_REPOSITORY }}:hardened'
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload image tarball
        if: steps.awscheck.outputs.configured != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: joern-image
          path: joern-hardened.tar.gz
          compression-level: 0 # already gzipped
          retention-days: 5
